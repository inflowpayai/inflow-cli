packages:
  - 'packages/*'

engineStrict: true

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*types*'

allowBuilds:
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@inflowpayai/mpp'
  - '@inflowpayai/mpp-buyer'
  - '@inflowpayai/x402'
  - '@inflowpayai/x402-buyer'
  - '@aep-foundation/agent@0.3.0'
  - '@aep-foundation/core@0.3.0'
  - '@aep-foundation/platform@0.2.1'

auto-install-peers: true

strict-peer-dependencies: false

allowUnusedPatches: false

patchedDependencies:
  incur: patches/incur.patch
