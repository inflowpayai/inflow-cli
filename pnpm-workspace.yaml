packages:
  - 'packages/*'

engineStrict: true

publicHoistPattern:
  - '*eslint*'
  - '*prettier*'
  - '*types*'

allowBuilds:
  esbuild: true
  msw: true

minimumReleaseAgeExclude:
  - '@inflowpayai/mpp'
  - '@inflowpayai/mpp-buyer'
  - '@inflowpayai/x402'
  - '@inflowpayai/x402-buyer'
  - '@aep-foundation/agent@0.3.3'
  - '@aep-foundation/core@0.5.0'
  - '@aep-foundation/platform@0.2.3'
  - '@offering-protocol/agent@0.3.0'
  - '@offering-protocol/core@0.3.5'
  - '@offering-protocol/directory@0.2.4'

auto-install-peers: true

strict-peer-dependencies: false

allowUnusedPatches: false

patchedDependencies:
  '@apidevtools/json-schema-ref-parser@15.5.2': patches/@apidevtools__json-schema-ref-parser@15.5.2.patch
  incur@0.4.19: patches/incur@0.4.19.patch
